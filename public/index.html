<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instagram</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>📷</text></svg>" type="image/svg+xml">
</head>
<body>
    <div class="app">
        <!-- Language Selector -->
        <div class="language-bar">
            <select class="language-select">
                <option value="en">English (UK)</option>
                <option value="hi">हिन्दी</option>
                <option value="es">Español</option>
                <option value="fr">Français</option>
                <option value="de">Deutsch</option>
                <option value="ja">日本語</option>
                <option value="ko">한국어</option>
                <option value="pt">Português</option>
            </select>
        </div>

        <!-- Instagram Logo -->
        <div class="logo-container">
            <svg class="instagram-logo" viewBox="0 0 132 132" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="ig-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#FFDD55"/>
                        <stop offset="10%" style="stop-color:#FFDD55"/>
                        <stop offset="25%" style="stop-color:#FF543E"/>
                        <stop offset="45%" style="stop-color:#C837AB"/>
                        <stop offset="70%" style="stop-color:#8A3AC8"/>
                        <stop offset="100%" style="stop-color:#4F5BD5"/>
                    </linearGradient>
                    <radialGradient id="ig-radial" cx="20%" cy="100%" r="120%">
                        <stop offset="0%" style="stop-color:#FFDD55"/>
                        <stop offset="10%" style="stop-color:#FFDD55"/>
                        <stop offset="25%" style="stop-color:#FF543E"/>
                        <stop offset="60%" style="stop-color:#C837AB"/>
                        <stop offset="100%" style="stop-color:#8A3AC8"/>
                    </radialGradient>
                </defs>
                <!-- Outer rounded square -->
                <rect x="6" y="6" width="120" height="120" rx="30" ry="30" fill="none" stroke="url(#ig-radial)" stroke-width="8"/>
                <!-- Inner circle (lens) -->
                <circle cx="66" cy="66" r="27" fill="none" stroke="url(#ig-radial)" stroke-width="8"/>
                <!-- Flash dot -->
                <circle cx="100" cy="32" r="8" fill="url(#ig-gradient)"/>
            </svg>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="login-form" autocomplete="off">
            <div class="input-group">
                <div class="input-container">
                    <input type="text" id="username" name="username" placeholder=" " required>
                    <label for="username">Username, email address or mobile number</label>
                </div>
            </div>

            <div class="input-group">
                <div class="input-container">
                    <input type="password" id="password" name="password" placeholder=" " required>
                    <label for="password">Password</label>
                    <button type="button" class="toggle-pwd" id="togglePassword" tabindex="-1">Show</button>
                </div>
            </div>

            <button type="submit" class="btn-login" id="loginBtn" disabled>Log in</button>

            <!-- Divider -->
            <div class="divider">
                <div class="line"></div>
                <span>OR</span>
                <div class="line"></div>
            </div>

            <a href="#" class="facebook-btn">
                <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor">
                    <path d="M16 8.049c0-4.446-3.582-8.05-8-8.05C3.58 0 0 3.603 0 8.05 0 12.07 2.925 15.44 6.75 16v-5.624H4.72V8.05H6.75V6.276c0-2.017 1.195-3.132 3.022-3.132.876 0 1.791.157 1.791.157v1.98h-1.009c-.993 0-1.303.621-1.303 1.258V8.05h2.218l-.354 2.326H9.25V16c3.824-.56 6.75-3.93 6.75-7.951z"/>
                </svg>
                Log in with Facebook
            </a>

            <a href="#" class="forgot-link">Forgotten password?</a>
        </form>

        <!-- Spacer pushes bottom section down -->
        <div class="spacer"></div>

        <!-- Bottom Section -->
        <div class="bottom-section">
            <button class="btn-create" id="signupLink">Create new account</button>
            <div class="meta-logo">
                <svg viewBox="0 0 500 100" width="67" height="14" fill="currentColor" class="meta-svg">
                    <text x="0" y="78" font-family="Arial, sans-serif" font-size="90" font-weight="bold" letter-spacing="-2">
                        <tspan>∞</tspan> Meta
                    </text>
                </svg>
            </div>
        </div>
    </div>

    <!-- Signup Modal -->
    <div class="modal-overlay" id="signupModal">
        <div class="app">
            <div class="modal-header">
                <button class="back-btn" id="backToLogin">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                    </svg>
                </button>
            </div>
            <div class="logo-container" style="margin-top: 10px;">
                <svg class="instagram-logo" viewBox="0 0 132 132" xmlns="http://www.w3.org/2000/svg" style="width: 60px; height: 60px;">
                    <defs>
                        <linearGradient id="ig-gradient2" x1="0%" y1="100%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#FFDD55"/>
                            <stop offset="25%" style="stop-color:#FF543E"/>
                            <stop offset="45%" style="stop-color:#C837AB"/>
                            <stop offset="70%" style="stop-color:#8A3AC8"/>
                            <stop offset="100%" style="stop-color:#4F5BD5"/>
                        </linearGradient>
                        <radialGradient id="ig-radial2" cx="20%" cy="100%" r="120%">
                            <stop offset="0%" style="stop-color:#FFDD55"/>
                            <stop offset="25%" style="stop-color:#FF543E"/>
                            <stop offset="60%" style="stop-color:#C837AB"/>
                            <stop offset="100%" style="stop-color:#8A3AC8"/>
                        </radialGradient>
                    </defs>
                    <rect x="6" y="6" width="120" height="120" rx="30" ry="30" fill="none" stroke="url(#ig-radial2)" stroke-width="8"/>
                    <circle cx="66" cy="66" r="27" fill="none" stroke="url(#ig-radial2)" stroke-width="8"/>
                    <circle cx="100" cy="32" r="8" fill="url(#ig-gradient2)"/>
                </svg>
            </div>
            <form id="signupForm" class="login-form" autocomplete="off">
                <div class="input-group">
                    <div class="input-container">
                        <input type="text" id="signupEmail" placeholder=" " required>
                        <label for="signupEmail">Mobile number or email</label>
                    </div>
                </div>
                <div class="input-group">
                    <div class="input-container">
                        <input type="text" id="signupFullname" placeholder=" " required>
                        <label for="signupFullname">Full name</label>
                    </div>
                </div>
                <div class="input-group">
                    <div class="input-container">
                        <input type="text" id="signupUsername" placeholder=" " required>
                        <label for="signupUsername">Username</label>
                    </div>
                </div>
                <div class="input-group">
                    <div class="input-container">
                        <input type="password" id="signupPassword" placeholder=" " required>
                        <label for="signupPassword">Password</label>
                    </div>
                </div>
                <button type="submit" class="btn-login" id="signupBtn" disabled>Sign up</button>
            </form>
            <div class="bottom-section" style="margin-top: auto;">
                <p class="login-link-text">Already have an account? <a href="#" id="loginLink">Log in</a></p>
            </div>
        </div>
    </div>

    <!-- Success/Error Toast -->
    <div class="toast" id="toast">
        <span id="toastMessage"></span>
    </div>

    <!-- Success Modal -->
    <div class="modal-overlay" id="successModal">
        <div class="success-card">
            <div class="success-check">✓</div>
            <h2 id="successTitle">Login Successful!</h2>
            <p id="successMsg">Welcome back!</p>
            <button class="btn-login" style="opacity:1;cursor:pointer;margin-top:20px;" onclick="document.getElementById('successModal').classList.remove('show')">Continue</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
